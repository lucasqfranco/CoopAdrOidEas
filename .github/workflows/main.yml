name: Build CoopAndreas Debug APK (NDK + Compose)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK, NDK & CMake 3.22.1
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env.example, debug.keystore and build APK
        run: |
          PROJECT_ROOT=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)")
          echo "Detected project root at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=AIzaSyDummyKeyForCoopAndreasBuild" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          gradle assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk_out/CoopAndreas-debug.apk"

      - name: Upload Compiled CoopAndreas Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-debug-apk
          path: apk_out/CoopAndreas-debug.apk
          if-no-files-found: error
