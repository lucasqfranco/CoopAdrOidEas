name: Build CoopAndreas Debug APK (NDK + Compose)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply v3.3 Skin & Join-in-Progress Patch and Build Debug APK
        run: |
          python3 - << 'EOF'
          import os, subprocess, shutil, base64, zlib
          from pathlib import Path

          files_to_update = {
              "app/src/main/java/com/example/model/CampaignModels.kt": "",
              "app/src/main/java/com/example/installer/ModFileManager.kt": "",
              "app/src/main/java/com/example/network/CoopNetworkManager.kt": "",
              "app/src/main/java/com/example/ui/screens/LobbyScreen.kt": "",
              "app/src/main/cpp/coop_bridge.cpp": "",
          }
          for rel_p, b64_data in files_to_update.items():
              p = Path(rel_p)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(zlib.decompress(base64.b64decode(b64_data)))

          subprocess.run(["gradle", "assembleDebug", "--stacktrace"], check=True)

          out_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "apk_out"
          out_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2("app/build/outputs/apk/debug/app-debug.apk", out_dir / "CoopAndreas-debug.apk")
          EOF

      - name: Upload Compiled CoopAndreas Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-debug-apk
          path: apk_out/CoopAndreas-debug.apk
          if-no-files-found: error
